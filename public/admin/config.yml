# Decap CMS configuration, loaded by /admin (public/admin/index.html).
# Editor guide: docs/editing-testimonials.md. Setup: README.md, "Content editing (CMS)".

backend:
  name: github
  repo: deepmagnam/deepmagnam-site
  branch: main
  # GitHub login goes through our Vercel function (api/auth.ts, api/callback.ts).
  # base_url is set to the current site's address in index.html, so login
  # works on both the .vercel.app address and www.deepmagnam.in.
  auth_endpoint: api/auth
  commit_messages:
    create: "CMS: add {{collection}} “{{slug}}”"
    update: "CMS: update {{collection}} “{{slug}}”"
    delete: "CMS: delete {{collection}} “{{slug}}”"
    uploadMedia: "CMS: upload “{{path}}”"
    deleteMedia: "CMS: delete “{{path}}”"

# Draft -> In review -> Ready. Each entry is a pull request until it's published.
publish_mode: editorial_workflow

# On localhost, `npx decap-server` lets you edit the files in this checkout
# without logging in to GitHub (see README).
local_backend: true

site_url: https://www.deepmagnam.in
display_url: https://www.deepmagnam.in
logo_url: /favicon.svg

# Originals are kept in the repo but never deployed: the build resizes them to
# WebP (vite/content-plugin.ts). Collections set their own subfolder.
media_folder: content/media
public_folder: /content/media

collections:
  # To add a collection later (e.g. portfolio): copy this block, change name,
  # labels, folder, media_folder/public_folder and fields, reuse the shared
  # fields below with their aliases (*published_field, *display_order_field),
  # and add a matching definition in src/content/ (see src/content/collection.ts).
  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    description: >-
      Client quotes shown on the Testimonials page. Only entries marked
      “Published” (which needs the client's consent) appear on the website.
    folder: content/testimonials
    format: json
    extension: json
    create: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}} · {{published | ternary('published', 'hidden')}}"
    sortable_fields: [order, name, date]
    view_filters:
      - { label: Published, field: published, pattern: true }
      - { label: Hidden, field: published, pattern: false }
    media_folder: /content/media/testimonials
    public_folder: /content/media/testimonials
    fields:
      - { label: Client name, name: name, widget: string }
      - label: Quote
        name: quote
        widget: text
        hint: Up to 300 characters.
        pattern: ['^[\s\S]{1,300}$', "Keep the quote to 300 characters or fewer."]
      - { label: Role, name: role, widget: string, required: false, hint: "e.g. Engineering Manager" }
      - { label: Company, name: company, widget: string, required: false }
      - label: Photo
        name: photo
        widget: image
        required: false
        choose_url: false
        hint: Optional. A square-ish JPG or PNG of the face works best; it's resized automatically.
        media_library:
          config:
            max_file_size: 10000000 # 10 MB
      - label: Rating
        name: rating
        widget: number
        value_type: int
        min: 1
        max: 5
        required: false
        hint: Optional, 1–5 stars. Leave empty to show no stars.
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        required: false
        hint: When the client gave the testimonial. Newer ones are shown first among equal display orders.
      - &display_order_field
        label: Display order
        name: order
        widget: number
        value_type: int
        required: false
        hint: Lower numbers are shown first (1 = first). Leave empty to show it after the numbered ones.
      - label: Client consent to publish
        name: consent
        widget: boolean
        default: false
        hint: Tick only when the client has agreed (in writing) to this quote, name and photo appearing on the website. Required before publishing.
      - &published_field
        label: Published
        name: published
        widget: boolean
        default: false
        hint: Shown on the website when on. Turn off to hide it without deleting it.
